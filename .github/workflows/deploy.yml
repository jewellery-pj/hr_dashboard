name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hr-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify build before deploy
        run: |
          npm ci
          npm run build

      - name: Deploy via HTTPS webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL and DEPLOY_WEBHOOK_SECRET must be configured in repository secrets."
            exit 1
          fi

          echo "Triggering production deploy via webhook..."
          for attempt in 1 2 3; do
            if curl -fsS -X POST "$DEPLOY_WEBHOOK_URL" \
              -H "Authorization: Bearer $DEPLOY_WEBHOOK_SECRET" \
              -H "Content-Type: application/json" \
              --max-time 30; then
              echo "Deploy accepted by server"
              exit 0
            fi
            echo "Webhook attempt $attempt failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Webhook deploy failed after 3 attempts"
          exit 1
